name: Deploy CMS

# Payload admin + REST/Local API + the /api/quote,/search,/track endpoints. Runs on
# native Node on the DigitalOcean droplet under systemd (ADR-0005). Migrations run on
# the droplet (the DB is local to it), then the service is rebuilt and restarted.
#
# Required repo secrets: DROPLET_HOST, DROPLET_USER, DROPLET_SSH_KEY.
# The droplet user needs passwordless `systemctl restart mrpackermover-cms` (sudoers).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/cms/**'
      - 'packages/**'

jobs:
  migrate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Migrate, build & restart on the droplet
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /srv/mrpackermover
            git pull --ff-only
            pnpm install --frozen-lockfile
            pnpm --filter @mpm/cms migrate
            pnpm --filter @mpm/cms build
            sudo systemctl restart mrpackermover-cms
