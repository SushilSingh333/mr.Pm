name: Deploy web

# Publishes the static site to the DigitalOcean droplet (ADR-0005). The build runs ON
# the droplet (deploy/deploy.sh) because build-manifest needs the local Postgres; the
# script also rsyncs dist/ into Caddy's web root and purges Cloudflare.
#
# Required repo secrets: DROPLET_HOST, DROPLET_USER, DROPLET_SSH_KEY.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'scripts/**'
      - 'deploy/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Build & publish on the droplet
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /srv/mrpackermover
            git pull --ff-only
            pnpm install --frozen-lockfile
            bash deploy/deploy.sh
