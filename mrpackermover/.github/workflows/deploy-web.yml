name: Deploy web

# Publishes the static site to the DigitalOcean droplet (ADR-0005). The build runs ON
# the droplet (deploy/deploy.sh) because build-manifest needs the local Postgres; the
# script also rsyncs dist/ into Caddy's web root and purges Cloudflare.
#
# Required repo secrets: DROPLET_HOST, DROPLET_USER, DROPLET_SSH_KEY.
#
# ⚠️  THIS WORKFLOW IS CURRENTLY INERT — AND THAT IS DELIBERATE.
# GitHub only reads workflows from `.github/workflows/` at the REPOSITORY ROOT. This
# file lives one level down (`mrpackermover/.github/workflows/`), so Actions never runs
# it. Production is deployed by hand.
#
# Moving this file to the repo root ACTIVATES it: every push to main would rebuild and
# republish the live site. Do not move it without deciding you want push-to-deploy. The
# quality-gate CI (which touches nothing outside the runner) lives at the repo root as
# `.github/workflows/ci.yml`.
#
# Paths below are repo-root-relative and account for the project being nested in
# `mrpackermover/`.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mrpackermover/apps/web/**'
      - 'mrpackermover/packages/**'
      - 'mrpackermover/scripts/**'
      - 'mrpackermover/deploy/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Build & publish on the droplet
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -euo pipefail
            # The clone is at .../repo; the pnpm workspace is nested one level inside it.
            cd /srv/mrpackermover/repo
            git pull --ff-only
            cd mrpackermover
            pnpm install --frozen-lockfile
            bash deploy/deploy.sh
